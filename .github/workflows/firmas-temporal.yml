# TEMPORAL (G5b, Parte 0): inventario de firmas del ZIP de prueba de G6.
# Se quita antes de abrir el PR.
name: Inventario de firmas (temporal)

on:
  push:
    branches: [feat/package-windows]

permissions:
  contents: read
  actions: read

jobs:
  firmas:
    runs-on: windows-latest
    steps:
      - name: Bajar el ZIP de prueba de G6 (CI de main, 829618f)
        uses: actions/download-artifact@v8
        with:
          name: moss-gui-windows-prueba-release
          path: prueba
          run-id: 42728322521
          github-token: ${{ github.token }}

      - name: Firmas
        shell: pwsh
        run: |
          Get-ChildItem prueba -Recurse -File | Where-Object Extension -In '.exe', '.dll' |
            Sort-Object Name | ForEach-Object {
              $s = Get-AuthenticodeSignature $_.FullName
              $v = $_.VersionInfo
              [pscustomobject]@{
                Archivo   = $_.Name
                Estado    = $s.Status
                Tipo      = $s.SignatureType
                Firmante  = $s.SignerCertificate.Subject
                Emisor    = $s.SignerCertificate.Issuer
                Empresa   = $v.CompanyName
                Producto  = $v.ProductName
                Version   = $v.FileVersion
                KB        = [math]::Round($_.Length / 1KB)
              }
            } | Format-List
