<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Moss — chat nuevo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#8DBF5F}a:hover{color:#B5D395}
.opc .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.opc:hover .tip,.opc:focus-visible .tip{opacity:1}
.opc:hover{background:#22301F}
.nav:hover{background:#22301F}
.fila:hover{background:#22301F}
</style>
</helmet>
<div style="height: 100vh; overflow-y: auto; display: flex; flex-wrap: wrap; background: #0F1411; color: #E6EDE7; font-family: 'Geist', system-ui, sans-serif">

  <aside style="flex: 1 1 272px; max-width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 14px; background: #161D18; box-shadow: inset -1px 0 0 #2A352D">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 48V30a9 9 0 0 1 18 0v18M26 30a9 9 0 0 1 18 0v18" fill="none" stroke="#8DBF5F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><rect x="49" y="39" width="10" height="10" rx="1.5" fill="#8DBF5F"></rect></svg>
      <span style="font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">moss<span style="color: #8DBF5F">_</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <button type="button" class="nav" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: #22301F; color: #E6EDE7; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="flex: 1; text-align: left">Nuevo chat</span>
        <kbd style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9AA89E">Ctrl+N</kbd>
      </button>
      <button type="button" class="nav" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="flex: 1; text-align: left">Buscar chats</span>
        <kbd style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9AA89E">Ctrl+K</kbd>
      </button>
    </div>

    <nav aria-label="Chats" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 0 10px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA89E">Últimos 7 días</span>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Selection sort en C++</span></button>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Fotosíntesis en dos líneas</span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 0 10px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA89E">18 oct</span>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Resuelve x² − 5x + 6 = 0</span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 0 10px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA89E">10 oct</span>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2" stroke-linecap="round" role="img" aria-label="Con búsqueda web" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Noticias recientes de Linux</span>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">¿Por qué Python es tan popular?</span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 0 10px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA89E">8 oct</span>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Calculadora en C++</span></button>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2" stroke-linecap="round" role="img" aria-label="Con búsqueda web" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">¿Quién ganó el último partido?</span>
        </button>
      </div>
    </nav>

    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; box-shadow: inset 0 1px 0 #2A352D">
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        <span style="flex: 1">Configuración</span>
        <kbd style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9AA89E">F2</kbd>
      </button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; height: 100vh; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; box-shadow: inset 0 -1px 0 #2A352D">
      <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <button type="button" aria-label="Ocultar barra lateral (Ctrl+B)" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: transparent; color: #9AA89E; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg>
        </button>
        <h1 style="margin: 0; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Nuevo chat</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
          Exportar
        </button>
      </div>
    </header>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
      <div style="max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="flex: none"><path d="M8 48V30a9 9 0 0 1 18 0v18M26 30a9 9 0 0 1 18 0v18" fill="none" stroke="#8DBF5F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><rect x="49" y="39" width="10" height="10" rx="1.5" fill="#8DBF5F"></rect></svg>
        <h2 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em">¿En qué te ayudo?</h2>
        <sc-if value="{{ sinConfigurar }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 8px; padding: 20px 24px; border-radius: 16px; background: #161D18; box-shadow: inset 0 0 0 1px #2A352D">
            <span style="font-size: 16px; font-weight: 600">Falta configurar el proveedor</span>
            <span style="font-size: 14px; line-height: 1.5; color: #9AA89E">Agrega la URL base, la API key y el modelo para empezar a platicar.</span>
            <a href="Config-proveedor.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #8DBF5F; color: #0F1411; font-size: 14px; font-weight: 600; text-decoration: none">Ir a Configuración</a>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="padding: 0 24px 20px">
      <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px">
        <div style="position: relative; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 14px; background: #1E2721; box-shadow: inset 0 0 0 1px #2A352D">
          <sc-if value="{{ opcionesAbiertas }}" hint-placeholder-val="{{ true }}">
          <div role="dialog" aria-label="Opciones" style="position: absolute; left: 0; bottom: calc(100% + 8px); width: 360px; max-width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 14px; background: #161D18; box-shadow: inset 0 0 0 1px #2A352D, 0 16px 40px rgba(0,0,0,0.45); z-index: 2">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 4px">
              <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA89E">Modelo</span>
              <button type="button" aria-haspopup="listbox" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: #1E2721; box-shadow: inset 0 0 0 1px #2A352D; color: #E6EDE7; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
                <span style="flex: 1">NVIDIA NIM</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
              <div style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #1E2721; box-shadow: inset 0 0 0 1px #2A352D">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <label for="filtro-modelo" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrar modelos</label>
                <input id="filtro-modelo" type="search" placeholder="Filtrar modelos" style="flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 14px; outline: none">
              </div>
            </div>
            <div role="listbox" aria-label="Modelos de NVIDIA NIM" style="display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow-y: auto; padding: 0 4px">
              <button type="button" role="option" aria-selected="true" class="fila" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: #22301F; color: #E6EDE7; font-family: 'Geist Mono', monospace; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">z-ai/glm5</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8DBF5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
              <button type="button" role="option" aria-selected="false" class="fila" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #E6EDE7; font-family: 'Geist Mono', monospace; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">moonshotai/kimi-k3</span></button>
              <button type="button" role="option" aria-selected="false" class="fila" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #E6EDE7; font-family: 'Geist Mono', monospace; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">nvidia/nemotron-3-ultra</span></button>
              <button type="button" role="option" aria-selected="false" class="fila" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #E6EDE7; font-family: 'Geist Mono', monospace; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">qwen/qwen3.5-coder</span></button>
              <button type="button" role="option" aria-selected="false" class="fila" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #E6EDE7; font-family: 'Geist Mono', monospace; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">deepseek-ai/deepseek-v4</span></button>
            </div>
            <div aria-hidden="true" style="height: 1px; margin: 6px 8px; background: #2A352D"></div>
            <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border-radius: 10px; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Buscar en la web</span><span style="font-size: 12px; color: #9AA89E">Responde con fuentes citadas</span></span>
              <input type="checkbox" role="switch" checked style="width: 20px; height: 20px; margin: 0; accent-color: #8DBF5F; flex: none">
            </label>
            <div aria-hidden="true" style="height: 1px; margin: 6px 8px; background: #2A352D"></div>
            <a href="Config-modelo.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; color: #E6EDE7; text-decoration: none; font-size: 14px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
              <span style="flex: 1">Configuración del modelo</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA89E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </div>
          </sc-if>
          <label for="msg-d" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensaje</label>
          <textarea id="msg-d" rows="1" placeholder="Escribe tu mensaje" style="resize: none; border: 0; padding: 10px 8px 6px; background: transparent; color: #E6EDE7; font-family: inherit; font-size: 15px; line-height: 1.5; outline: none"></textarea>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
              <button type="button" class="opc" aria-label="Opciones" aria-haspopup="dialog" aria-expanded="{{ opcionesAbiertas }}" style="position: relative; width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: {{ fondoEngrane }}; color: #E6EDE7; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span class="tip" aria-hidden="true" style="background: #E6EDE7; color: #0F1411">Opciones</span>
              </button>
              <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 4px 0 10px; border-radius: 999px; background: #22301F; color: #B5D395; font-size: 13px; font-weight: 500; white-space: nowrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
                Búsqueda web
                <button type="button" aria-label="Quitar la búsqueda web" style="width: 26px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: #B5D395; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
              </span>
            </div>
            <button type="button" class="opc" aria-label="Enviar" style="position: relative; width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: transparent; color: #8DBF5F; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="tip" aria-hidden="true" style="background: #E6EDE7; color: #0F1411">Enviar</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
          </div>
        </div>
        <p style="margin: 0; text-align: center; font-size: 12px; color: #9AA89E">Enter envía · Shift+Enter nueva línea · / comandos</p>
      </div>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sinConfigurar":{"editor":"boolean","default":false},"opcionesAbiertas":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const abiertas = this.props.opcionesAbiertas ?? true;
return { sinConfigurar: this.props.sinConfigurar ?? false, opcionesAbiertas: abiertas, fondoEngrane: abiertas ? '#22301F' : 'transparent' };
}
}
</script>
</body>
</html>
