name: moss_gui
description: "Interfaz gráfica de Moss"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  json_rpc_2: ^3.0.2
  stream_channel: ^2.1.2
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.otf
          weight: 400
        - asset: assets/fonts/Geist-Medium.otf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.otf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.otf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.otf
          weight: 500
